# Render Blueprint: deploys FitPlan as a web service.
# The database lives on Supabase; paste its session pooler URL as DATABASE_URL when Render asks.
services:
  - type: web
    name: fitplan
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Render asks for it when you create the service
      - key: SECRET_KEY
        generateValue: true # Render generates a long random secret
