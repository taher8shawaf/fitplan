[project]
name = "fitplan"
version = "1.0.0"
description = "Gym workout scheduling and meal tracking API (Arabic / English)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlmodel>=0.0.22",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "psycopg[binary]>=3.2",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI uses function calls in defaults (Query, Depends)

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
